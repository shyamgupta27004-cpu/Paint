
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brushify</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <center>
        <h1>Brushify</h1>

        <div id="box" contenteditable="true">
            Write Something...
        </div>

        <br><br>

        <button id="dwd-btn">Download</button>
        <br><br>

        <div id="second">

            <div id="bg-color">
                <h2>Choose Background Color</h2>

                <button onclick="changeBackgroundColor('red')" style="background:red"></button>
                <button onclick="changeBackgroundColor('green')" style="background:green"></button>
                <button onclick="changeBackgroundColor('blue')" style="background:blue"></button>
                <button onclick="changeBackgroundColor('yellow')" style="background:yellow"></button>
                <button onclick="changeBackgroundColor('orange')" style="background:orange"></button>
                <button onclick="changeBackgroundColor('purple')" style="background:purple"></button>
                <button onclick="changeBackgroundColor('pink')" style="background:pink"></button>
                <button onclick="changeBackgroundColor('brown')" style="background:brown"></button>
                <button onclick="changeBackgroundColor('black')" style="background:black"></button>
                <button onclick="changeBackgroundColor('white')" style="background:white"></button>
            </div>

            <div id="text-color">
                <h2>Choose Text Color</h2>

                <button onclick="changeTextColor('red')" style="background:red"></button>
                <button onclick="changeTextColor('green')" style="background:green"></button>
                <button onclick="changeTextColor('blue')" style="background:blue"></button>
                <button onclick="changeTextColor('yellow')" style="background:yellow"></button>
                <button onclick="changeTextColor('purple')" style="background:purple"></button>
                <button onclick="changeTextColor('pink')" style="background:pink"></button>
                <button onclick="changeTextColor('orange')" style="background:orange"></button>
                <button onclick="changeTextColor('black')" style="background:black"></button>
                <button onclick="changeTextColor('gray')" style="background:gray"></button>
                <button onclick="changeTextColor('white')" style="background:white"></button>
            </div>

            <div id="fonts">
                <h2>Choose Font Style</h2>
                  <button onclick="changefontfamily('Arial')">Arial</button>
                  <button onclick="changefontfamily('Georgia')">Georgia</button>
                  <button onclick="changefontfamily('cursive')">Cursive</button>
                  <button onclick="changefontfamily('monospace')">Monospace</button>
                  <button onclick="changefontfamily('Verdana')">Verdana</button>
                  <button onclick="changefontfamily('Impact')">Impact</button>
            </div>

        </div>
    </center>

    <script>
        function changeBackgroundColor(clr) {
            document.getElementById("box").style.backgroundColor = clr;
        }

        function changeTextColor(clr) {
            document.getElementById("box").style.color = clr;
        }

        function changefontfamily(font) {
            document.getElementById("box").style.fontFamily = font;
        }
    </script>

</body>
</html>
